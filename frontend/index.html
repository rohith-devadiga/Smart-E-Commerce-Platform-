<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smartshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10201F; --teal:#0F4C4A; --mist:#EDF3F1; --paper:#fff; --gold:#F5A400;
  --line:#D5E0DD; --muted:#5B6F6D; --red:#C8372D; --green:#1E7A4F;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);background:var(--mist);color:var(--ink);line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{font:800 24px/1 var(--display);letter-spacing:-.02em;color:var(--teal);text-decoration:none;white-space:nowrap}
.logo i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-left:3px}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:11px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--mist)}
.search input:focus{border-color:var(--teal);background:#fff;outline:none;box-shadow:0 0 0 3px #f5a40055}
.acts{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--teal);color:#fff;transition:background .15s}
.btn:hover{background:#0b3a38}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--teal);background:#fff}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.gold:hover{background:#e29700}
.badge{background:var(--gold);color:var(--ink);border-radius:999px;font-size:12px;font-weight:700;padding:1px 8px;margin-left:6px}
.who{font-size:14px;color:var(--muted);display:none}

/* Hero */
.hero{background:var(--teal);color:#fff}
.hero-in{max-width:1200px;margin:auto;padding:36px 20px 28px}
.hero h1{margin:0;font:800 clamp(30px,5vw,52px)/1.05 var(--display);letter-spacing:-.03em;max-width:14em}
.hero p{margin:10px 0 22px;color:#bfdcd8;max-width:34em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid #ffffff55;background:transparent;color:#fff;border-radius:999px;padding:7px 16px;font-weight:500}
.chip:hover{border-color:#fff}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}

/* Grid */
main{max-width:1200px;margin:auto;padding:22px 20px 60px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.bar span{color:var(--muted)}
.bar select{padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.tile{position:relative;aspect-ratio:5/4;display:grid;place-items:center;overflow:hidden}
.tile b{font:800 92px/1 var(--display);letter-spacing:-.05em;color:#10201F22}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.low{position:absolute;left:10px;top:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.low.out{background:var(--ink)}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:2px;flex:1}
.info h3{margin:0;font:600 18px/1.25 var(--display)}
.info small{color:var(--muted)}
.buy{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px}
.price{font:800 24px/1 var(--display);letter-spacing:-.02em}
.add{width:42px;height:42px;border-radius:50%;border:0;background:var(--gold);font-size:24px;font-weight:700;line-height:1}
.add:hover{background:#e29700}
.add[disabled]{background:var(--line);cursor:not-allowed}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px}

/* Drawer */
.veil{position:fixed;inset:0;background:#10201f88;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:40;transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font:800 22px var(--display)}
.x{border:0;background:var(--mist);width:36px;height:36px;border-radius:50%;font-size:20px}
.db{flex:1;overflow:auto;padding:8px 20px}
.df{padding:16px 20px;border-top:1px solid var(--line)}
.df:empty{display:none}
.line{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.mini{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font:800 24px var(--display);flex:none;color:#10201F55}
.line div:not(.mini){flex:1;min-width:0}
.line p{margin:0;font-weight:700}
.line small{color:var(--muted)}
.link{border:0;background:none;color:var(--red);font-weight:700;padding:4px}
.tot{display:flex;justify-content:space-between;font:800 22px var(--display);margin-bottom:12px}
.df .btn{width:100%}

/* Orders */
.order{padding:16px 0;border-bottom:1px solid var(--line)}
.order header{display:flex;justify-content:space-between;align-items:baseline}
.order h4{margin:0;font:800 18px var(--display)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--mist)}
.pill.paid{background:#d7f0e3;color:var(--green)}
.pill.failed{background:#f8dad7;color:var(--red)}
.items{margin:6px 0 12px;color:var(--muted);font-size:14px}
.steps{display:flex;list-style:none;margin:0;padding:0;gap:4px}
.steps li{flex:1;font-size:12px;color:var(--muted);border-top:4px solid var(--line);padding-top:6px}
.steps li.done{border-color:var(--teal);color:var(--ink);font-weight:700}
.cancel{color:var(--red);font-weight:700}

.soc-sep{display:flex;align-items:center;gap:10px;margin:18px 0 2px;color:#6b7b79;font-size:.82rem}
.soc-sep::before,.soc-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.dg .btn.soc{background:#fff;color:var(--ink);border:1.5px solid var(--line);margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px}
.dg .btn.soc:hover{border-color:var(--teal);background:#fff}
.dg .btn.soc svg{width:18px;height:18px}
/* Sign in dialog */
dialog{border:0;border-radius:20px;padding:0;width:min(400px,92vw)}
dialog::backdrop{background:#10201f99}
.dg{padding:24px}
.dg h2{margin:0 0 4px;font:800 26px var(--display)}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px;font-weight:700}
.tabs button[aria-selected=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.dg label{display:block;font-size:14px;font-weight:700;margin:12px 0 4px}
.dg input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px}
.dg .btn{width:100%;margin-top:18px}
.dg .close{display:block;margin:10px auto 0;border:0;background:none;color:var(--muted)}

/* Toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
  .top-in{flex-wrap:wrap}.search{order:3;flex-basis:100%;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <a class="logo" href="#">Smartshop<i></i></a>
  <label class="search"><span class="sr">Search products</span><input id="q" type="search" placeholder="Search headphones, bottles, keyboards"></label>
  <div class="acts">
    <span class="who" id="who"></span>
    <button class="btn ghost" id="ordBtn" hidden>Orders</button>
    <button class="btn" id="cartBtn">Cart<span class="badge" id="cnt">0</span></button>
    <button class="btn ghost" id="authBtn">Sign in</button>
  </div>
</div></header>

<section class="hero"><div class="hero-in">
  <h1>Gear you will use every day</h1>
  <p>Pay in rupees, and get a message the moment your order ships.</p>
  <div class="chips" id="chips" role="group" aria-label="Categories"></div>
</div></section>

<main>
  <div class="bar"><span id="count"></span>
    <label><span class="sr">Sort products</span>
      <select id="so"><option value="popularity">Most popular</option><option value="price_asc">Price: low to high</option><option value="price_desc">Price: high to low</option></select></label>
  </div>
  <div class="grid" id="g"></div>
</main>

<div class="veil" id="veil"></div>
<aside class="drawer" id="dr" aria-label="Cart and orders" aria-hidden="true">
  <div class="dh"><h2 id="dt"></h2><button class="x" id="dx" aria-label="Close">×</button></div>
  <div class="db" id="db"></div>
  <div class="df" id="df"></div>
</aside>

<dialog id="dlg"><div class="dg">
  <h2>Welcome to Smartshop</h2>
  <div class="tabs" role="tablist">
    <button role="tab" id="tLogin" aria-selected="true">Log in</button>
    <button role="tab" id="tSign" aria-selected="false">Create account</button>
  </div>
  <div id="nmRow" hidden><label for="nm">Name</label><input id="nm" autocomplete="name"></div>
  <label for="em">Email</label><input id="em" type="email" autocomplete="email">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" id="go">Log in</button>
  <div class="soc-sep">or continue with</div>
  <button class="btn soc" id="bGoogle" type="button"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.7l-7.4-5.8c-2.1 1.4-4.8 2.3-8.1 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button>
  <button class="btn soc" id="bFb" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>Continue with Facebook</button>
  <button class="close" id="dc">Not now</button>
</div></dialog>

<div class="toast" id="t" role="status" aria-live="polite"></div>

<script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
<script>
const API="http://127.0.0.1:8000";
/* Social login (Google / Facebook via Auth0): paste your values from the Auth0 dashboard */
const AUTH0={domain:"YOUR-TENANT.us.auth0.com",clientId:"YOUR_AUTH0_CLIENT_ID"};
const R=n=>"₹"+Number(n).toLocaleString("en-IN");
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CATS=["Audio","Outdoor","Wearables","Desk"];
const TINT={Audio:"#F7C85A",Outdoor:"#A9D3A4",Wearables:"#F4A896",Desk:"#A9BDF2"};
const tint=c=>TINT[c]||"#CFE0DC";
let tok=localStorage.tok||"",ws,cat="",mode="login",panel="",tt;

function toast(m){const t=$("t");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3500)}
async function api(p,o={}){
  const r=await fetch(API+p,{...o,headers:{"Content-Type":"application/json",...(tok?{Authorization:"Bearer "+tok}:{})}});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){toast(d.detail||"Something went wrong. Please try again.");throw d}
  return d;
}

/* Auth */
function setMode(m){mode=m;$("tLogin").setAttribute("aria-selected",m=="login");$("tSign").setAttribute("aria-selected",m=="sign");
  $("nmRow").hidden=m=="login";$("go").textContent=m=="login"?"Log in":"Create account";$("pw").autocomplete=m=="login"?"current-password":"new-password"}
$("tLogin").onclick=()=>setMode("login");$("tSign").onclick=()=>setMode("sign");
$("authBtn").onclick=()=>{if(tok)logout();else $("dlg").showModal()};
$("dc").onclick=()=>$("dlg").close();
$("go").onclick=async()=>{
  if(mode=="sign"){const d=await api("/auth/register",{method:"POST",body:JSON.stringify({name:$("nm").value,email:$("em").value,password:$("pw").value})});setTok(d.token)}
  else{const r=await fetch(API+"/auth/login",{method:"POST",body:new URLSearchParams({username:$("em").value,password:$("pw").value})});
    const d=await r.json().catch(()=>({}));if(!r.ok)return toast(d.detail||"Wrong email or password.");setTok(d.access_token)}
  $("dlg").close();
};
function setTok(t){tok=t;localStorage.tok=t;boot()}
function logout(){localStorage.removeItem("tok");tok="";if(ws)ws.close();closePanel();boot()}

/* Products */
function chips(){$("chips").innerHTML=["",...CATS].map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c||"All"}</button>`).join("")}
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;chips();load()};
let deb;$("q").oninput=()=>{clearTimeout(deb);deb=setTimeout(load,250)};$("so").onchange=load;
async function load(){
  const u=new URLSearchParams({sort:$("so").value,q:$("q").value,category:cat});[...u].forEach(([k,v])=>!v&&u.delete(k));
  const ps=await api("/products?"+u);
  $("count").textContent=ps.length+(ps.length==1?" product":" products");
  $("g").innerHTML=ps.length?ps.map(p=>`
  <article class="card">
    <div class="tile" style="background:${tint(p.category)}">
      ${p.image?`<img src="${API+esc(p.image)}" alt="${esc(p.name)}">`:`<b aria-hidden="true">${esc(p.name[0])}</b>`}
      ${p.stock==0?`<span class="low out">Sold out</span>`:p.stock<5?`<span class="low">Only ${p.stock} left</span>`:""}
    </div>
    <div class="info"><h3>${esc(p.name)}</h3><small>${esc(p.category)}</small>
      <div class="buy"><span class="price">${R(p.price)}</span>
      <button class="add" ${p.stock==0?"disabled":""} onclick="add(${p.id})" aria-label="Add ${esc(p.name)} to cart">+</button></div>
    </div>
  </article>`).join(""):`<div class="empty" style="grid-column:1/-1">No products match. Try a different search or category.</div>`;
}

/* Cart */
let CART={items:[],total:0};
async function cartData(){if(!tok){CART={items:[],total:0}}else CART=await api("/cart");
  $("cnt").textContent=CART.items.reduce((s,i)=>s+i.quantity,0)}
async function add(id){if(!tok){$("dlg").showModal();return toast("Log in to add items")}
  await api("/cart",{method:"POST",body:JSON.stringify({product_id:id,quantity:1})});await cartData();toast("Added to cart")}
async function rm(id){await api("/cart/"+id,{method:"DELETE"});await cartData();if(panel=="cart")showCart()}
function showCart(){
  $("dt").textContent="Your cart";
  $("db").innerHTML=!tok?`<div class="empty" style="margin:16px 0">Log in to see your cart.</div>`
   :CART.items.length?CART.items.map(i=>`<div class="line"><div class="mini" style="background:${tint(i.product.category)}">${esc(i.product.name[0])}</div>
     <div><p>${esc(i.product.name)}</p><small>${i.quantity} × ${R(i.product.price)}</small></div>
     <b>${R(i.product.price*i.quantity)}</b><button class="link" onclick="rm(${i.product.id})" aria-label="Remove ${esc(i.product.name)}">Remove</button></div>`).join("")
   :`<div class="empty" style="margin:16px 0">Your cart is empty. Add something from the shop.</div>`;
  $("df").innerHTML=tok&&CART.items.length?`<div class="tot"><span>Total</span><span>${R(CART.total)}</span></div><button class="btn gold" onclick="pay()">Pay with Stripe</button>`:"";
  openPanel("cart");
}
async function pay(){const d=await api("/checkout",{method:"POST"});
  if(d.checkout_url)location=d.checkout_url;
  else{toast("Payment received");await cartData();load();showOrders()}}

/* Orders */
const STEPS=["pending","processing","shipped","delivered"];
async function showOrders(){
  const o=await api("/orders");$("dt").textContent="Your orders";$("df").innerHTML="";
  $("db").innerHTML=o.length?o.map(x=>{const i=STEPS.indexOf(x.order_status);return `
   <div class="order"><header><h4>Order #${x.id}</h4><b>${R(x.total)}</b></header>
   <p class="items">${(x.items||[]).map(i=>`${esc(i.name)} × ${i.quantity}`).join(", ")}</p>
   <p style="margin:0 0 10px"><span class="pill ${esc(x.payment_status)}">Payment ${esc(x.payment_status)}</span></p>
   ${x.order_status=="cancelled"?`<span class="cancel">Cancelled</span>`:`<ol class="steps">${STEPS.map((s,n)=>`<li class="${n<=i?"done":""}">${s[0].toUpperCase()+s.slice(1)}</li>`).join("")}</ol>`}</div>`}).join("")
   :`<div class="empty" style="margin:16px 0">No orders yet. Your first one will show up here.</div>`;
  openPanel("orders");
}

/* Drawer */
function openPanel(p){panel=p;$("dr").classList.add("on");$("veil").classList.add("on");$("dr").setAttribute("aria-hidden","false")}
function closePanel(){panel="";$("dr").classList.remove("on");$("veil").classList.remove("on");$("dr").setAttribute("aria-hidden","true")}
$("veil").onclick=closePanel;$("dx").onclick=closePanel;
document.addEventListener("keydown",e=>{if(e.key=="Escape")closePanel()});
$("cartBtn").onclick=async()=>{await cartData();showCart()};
$("ordBtn").onclick=showOrders;

/* Social login */
let a0;
async function a0c(){
  if(!a0)a0=await auth0.createAuth0Client({domain:AUTH0.domain,clientId:AUTH0.clientId,
    authorizationParams:{redirect_uri:location.origin,scope:"openid profile email"}});
  return a0;
}
async function social(conn){
  if(AUTH0.domain.startsWith("YOUR-")||AUTH0.clientId.startsWith("YOUR_"))return toast("Add your Auth0 domain and client ID in index.html first.");
  try{const c=await a0c();await c.loginWithRedirect({authorizationParams:{connection:conn}})}
  catch(e){toast("Could not start social login.")}
}
$("bGoogle").onclick=()=>social("google-oauth2");
$("bFb").onclick=()=>social("facebook");
async function socialCallback(){
  const q=location.search;
  if(!(q.includes("code=")&&q.includes("state=")))return;
  try{
    const c=await a0c();await c.handleRedirectCallback();
    const claims=await c.getIdTokenClaims();
    const d=await api("/auth/auth0",{method:"POST",body:JSON.stringify({id_token:claims.__raw})});
    tok=d.access_token;localStorage.tok=tok;
  }catch(e){if(e instanceof Error)toast("Social login failed. Please try again.")}
  history.replaceState({},"",location.pathname);
}

/* Boot */
async function boot(){
  $("authBtn").textContent=tok?"Log out":"Sign in";$("ordBtn").hidden=!tok;$("who").style.display="none";
  chips();load();
  if(!tok){await cartData();return}
  try{const m=await api("/me");$("who").textContent=m.name+" ("+m.role+")";$("who").style.display="inline"}catch(e){return logout()}
  cartData();
  ws=new WebSocket(API.replace("http","ws")+"/ws/notifications?token="+tok);
  ws.onmessage=e=>{toast(JSON.parse(e.data).message);if(panel=="orders")showOrders()};
}
socialCallback().then(boot);
</script>
</body>
</html>
