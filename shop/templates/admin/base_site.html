{% extends "admin/base.html" %}
{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | Smartshop{% endblock %}
{% block extrastyle %}{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#0F4C4A;--secondary:#0F4C4A;--accent:#F5A400;--primary-fg:#fff;--link-fg:#0F4C4A;--link-hover-color:#0b3a38;
--header-bg:#0F4C4A;--header-color:#fff;--header-branding-color:#fff;--header-link-color:#fff;
--breadcrumbs-bg:#EDF3F1;--breadcrumbs-fg:#0F4C4A;--breadcrumbs-link-fg:#0F4C4A;
--body-bg:#EDF3F1;--body-fg:#10201F;--button-bg:#0F4C4A;--button-hover-bg:#0b3a38;--default-button-bg:#F5A400;--default-button-hover-bg:#e29700;
--object-tools-bg:#F5A400;--object-tools-hover-bg:#e29700;--selected-row:#FFF1CC;--font-family-primary:"DM Sans","Segoe UI",system-ui,sans-serif}
#branding h1,#branding h1 a:link,#branding h1 a:visited{font-family:"Bricolage Grotesque","Segoe UI",sans-serif;font-weight:800;letter-spacing:-.02em;color:#fff}
.default,.default:visited{color:#10201F!important}
.object-tools a:link,.object-tools a:visited{color:#10201F;font-weight:700}
.module{border-radius:14px;overflow:hidden;border:1px solid #D5E0DD;background:#fff}
.module caption,.module h2,#changelist-filter h2{background:#0F4C4A;color:#fff}
.button,input[type=submit],input[type=button],.submit-row input{border-radius:999px;font-weight:700}
</style>
{% endblock %}
{% block branding %}<div id="site-name"><a href="{% url 'admin:index' %}">Smartshop Admin</a></div>
<div style="margin-left:24px"><a href="/dashboard/" style="color:#F5A400;font-weight:700">Sales dashboard</a></div>{% endblock %}
{% block nav-global %}{% endblock %}
